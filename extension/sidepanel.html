<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint</title>
  </head>
  <body>
    <header>
      <h1>Waypoint</h1>
      <span id="nano" class="badge">checking Nano…</span>
    </header>

    <section id="site" class="site">
      <div class="site-row">
        <span id="site-text">Checking this page…</span>
        <button type="button" id="site-enable" class="secondary" hidden>Enable on this site</button>
        <button type="button" id="site-disable" class="link" hidden>Turn off here</button>
      </div>
      <label class="toggle"><input type="checkbox" id="all-sites" /> Allow on all sites</label>
      <div id="docs-allow" class="site-row" hidden>
        <span id="docs-allow-text"></span>
        <button type="button" id="docs-allow-btn" class="secondary">Allow</button>
      </div>
    </section>

    <form id="ask-form">
      <textarea id="q" rows="3" placeholder="Ask to get something done (“Create a service account key”) or to understand the page (“What do these settings do?”)"></textarea>
      <div class="row">
        <button type="submit" id="ask">Ask</button>
        <label class="toggle"><input type="checkbox" id="force-cloud" /> Cloud only</label>
      </div>
    </form>

    <p id="status" class="status">Open the page you need help with, then ask.</p>
    <div id="paused" class="paused" hidden>
      <button type="button" id="resume">Resume guide</button>
      <button type="button" id="end" class="link">End guide</button>
    </div>

    <section id="route" hidden>
      <h2 id="route-title">Route</h2>
      <ol id="steps"></ol>
      <button type="button" id="replan" class="secondary" hidden>Re-plan from this page</button>
    </section>

    <section>
      <h2>Escalation receipt</h2>
      <p class="hint">Every AI call, where it ran, and exactly what left your device.</p>
      <ul id="log"></ul>
    </section>

    <script type="module" src="./src/sidepanel.js"></script>
  </body>
</html>
