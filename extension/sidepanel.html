<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint Trace</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <div class="wordmark" aria-label="Waypoint">WAYP<span class="o" aria-hidden="true"></span>INT</div>
        <span class="tag">Trace</span>
      </div>
      <span id="nano" class="nano"><span class="dot off"></span><span id="nano-text">Checking Nano…</span></span>
    </header>

    <section class="tally" aria-label="Where the AI ran">
      <div class="t device"><span class="n" id="n-device">0</span><span class="l">on this device</span></div>
      <div class="t cloud"><span class="n" id="n-cloud">0</span><span class="l">in the cloud</span></div>
      <div class="t free"><span class="n" id="n-free">0</span><span class="l">no AI needed</span></div>
    </section>

    <section id="now" class="now" hidden>
      <div class="now-head"><span id="now-kind" class="kicker">Route</span><span id="now-goal" class="goal"></span></div>
      <ol id="steps" class="route"></ol>
    </section>
    <p id="status" class="status">Open the Waypoint bar on any page (<span class="kbd">Alt</span><span class="kbd">Shift</span><span class="kbd">W</span>) and ask. Every AI call shows up here.</p>

    <section class="outage" aria-label="Simulate an outage">
      <span class="kicker" title="Turn Gemini Nano or cloud Gemini off to see how Waypoint degrades. Real outages are handled the same way.">Simulate an outage</span>
      <div class="filters" id="sim" role="radiogroup" aria-label="Simulate an outage">
        <button type="button" role="radio" aria-checked="true" data-sim="none">Off</button>
        <button type="button" role="radio" aria-checked="false" data-sim="no-nano">No Nano</button>
        <button type="button" role="radio" aria-checked="false" data-sim="no-cloud">No cloud</button>
        <button type="button" role="radio" aria-checked="false" data-sim="neither">Neither</button>
      </div>
    </section>

    <section class="receipts">
      <div class="r-head">
        <h2>Receipts</h2>
        <div class="filters" role="radiogroup" aria-label="Filter receipts">
          <button type="button" role="radio" aria-checked="true" data-f="all">All</button>
          <button type="button" role="radio" aria-checked="false" data-f="on_device">On-device</button>
          <button type="button" role="radio" aria-checked="false" data-f="in_cloud">Cloud</button>
        </div>
      </div>
      <ul id="log" class="log"></ul>
    </section>
    <script type="module" src="./src/sidepanel.js"></script>
  </body>
</html>
