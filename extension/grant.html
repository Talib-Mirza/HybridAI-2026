<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow Waypoint</title>
  </head>
  <body>
    <main class="grant">
      <div class="wordmark" aria-label="Waypoint">WAYP<span class="o" aria-hidden="true"></span>INT</div>
      <h1 id="title">One click to allow</h1>
      <p id="why" class="why"></p>
      <ul id="sites" class="sites"></ul>
      <div class="actions">
        <button id="allow" class="btn">Allow</button>
        <button id="cancel" class="btn ghost">Not now</button>
      </div>
      <p class="fine">Chrome will ask you to confirm. You can turn this off any time from the Waypoint bar.</p>
    </main>
    <script type="module" src="./src/grant.js"></script>
  </body>
</html>
